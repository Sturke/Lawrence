name: Lawrence CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install test and DKIM dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-dkim.txt
      - name: Check tracked files for local data
        run: |
          tracked_data=$(git ls-files -- ':(icase,glob)**/email-samples/**' ':(icase,glob)**/*.eml' ':(icase,glob)**/*.sqlite*' ':(icase,glob)**/*.db' ':!tests/fixtures/sample.eml')
          if [ -n "$tracked_data" ]; then
            echo "::error::Tracked email or database files found. Commit only the existing synthetic email fixture."
            exit 1
          fi
      - name: Run regression tests
        run: python -m pytest -q -p no:cacheprovider
